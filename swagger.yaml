          description: Sender of the mail.
        subject:
          type: string
          description: Mail subject.
          example: "[TICKET-3A9F1C7B] Support request"
        content:
          type: string
          description: Body preview. The server truncates the content to 240 characters.
          example: "Hello, I need help with my account."
        status:
          type: string
          description: Current mail status.
          enum:
          - DRAFT
          - SENT
          - ERROR
        source:
          type: string
          description: Whether the mail originated inside the app or was imported
            from IMAP.
          enum:
          - EXTERN
          - INTERN
        trackingCode:
          type:
          - string
          - "null"
          description: Ticket tracking code.
          example: TICKET-3A9F1C7B
        externalSenderEmail:
          type:
          - string
          - "null"
          description: Original sender address for imported external mails.
          example: customer@example.com
        attachmentCount:
          type: integer
          format: int32
          description: Number of attachments on this mail.
          example: 2
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: 2026-06-25T12:30:00
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp.
          example: 2026-06-25T12:45:00
        sentAt:
          type:
          - string
          - "null"
