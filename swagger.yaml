      - content
      - createdAt
      - sender
      - source
      - status
      - subject
      - updatedAt
    PageResponseMailListItemDTO:
      type: object
      description: Generic page response wrapper.
      properties:
        content:
          type: array
          description: Items on the current page.
          items:
            $ref: "#/components/schemas/MailListItemDTO"
        page:
          type: integer
          format: int32
          description: Zero-based page index.
          example: 0
        size:
          type: integer
          format: int32
          description: Effective page size.
          example: 25
        totalElements:
          type: integer
          format: int64
          description: Total number of matching items.
          example: 142
        totalPages:
          type: integer
          format: int32
          description: Total number of available pages.
          example: 6
        hasNext:
          type: boolean
          description: Whether another page exists after the current page.
          example: true
      required:
      - content
      - hasNext
      - page
      - size
      - totalElements
      - totalPages
  securitySchemes:
    bearerAuth:
      type: http
      description: "JWT access token returned by `POST /api/login` or `POST /api/register`.\
        \ Use the `Authorization: Bearer <token>` header."
      scheme: bearer
      bearerFormat: JWT
