services:
  database:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # KEINE PORTS NACH AUSSEN – Erfüllt die Sicherheitsvorgabe!
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
        # Doppelte Absicherung für Spring Boot & Postgres
        SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
        SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME}
        SPRING_DATASOURCE_USERNAME: ${DB_USER}
        SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
        SPRING_JPA_HIBERNATE_DDL_AUTO: ${DB_DDL_AUTO:-update}
        DB_URL: jdbc:postgresql://database:5432/${DB_NAME}
        DB_DRIVER: org.postgresql.Driver
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_DDL_AUTO: ${DB_DDL_AUTO:-update}
        APP_NAME: ${APP_NAME:-mail-project}
        APP_SECRET: ${APP_SECRET}
        APP_JWT_EXPIRES: ${APP_JWT_EXPIRES:-3600}
        APP_JWT_SECRET: ${APP_JWT_SECRET}
        FILE_UPLOAD_DIR: uploads
        # Mail transport / inbox sync
        SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
        SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
        SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
        SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
        MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
        # SMTP debug/SSL troubleshooting
        SPRING_MAIL_PROPERTIES_MAIL_DEBUG: "true"
        SPRING_MAIL_PROPERTIES_MAIL_TRANSPORT_PROTOCOL: smtps
        SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST: mailgate.thm.de
        SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "true"
        SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
        SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
        MAIL_IMAP_HOST: ${MAIL_IMAP_HOST}
        MAIL_IMAP_PORT: ${MAIL_IMAP_PORT}
        MAIL_IMAP_USERNAME: ${MAIL_IMAP_USERNAME}
        MAIL_IMAP_PASSWORD: ${MAIL_IMAP_PASSWORD}
        MAIL_IMAP_FOLDER: ${MAIL_IMAP_FOLDER}
        MAIL_IMAP_POLL_INTERVAL_MS: ${MAIL_IMAP_POLL_INTERVAL_MS}
      # KEINE PORTS NACH AUSSEN – Sicher hinter Caddy versteckt!
    depends_on:
        database:
          condition: service_healthy
    volumes:
        - uploads:/mail-system/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads:
