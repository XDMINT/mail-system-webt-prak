server {
    listen ${PORT};
    server_name ${SERVER_NAME};
    return 301 https://$host$request_uri;
}

server {
    listen ${SSL_PORT} ssl;
    server_name ${SERVER_NAME};

    ssl_certificate     ${SSL_CERT_FILE};
    ssl_certificate_key ${SSL_CERT_KEY_FILE};

    server_tokens off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/ {
        # Keycloak validates client redirect URLs and the integrity-protected
        # KC_RESTART cookie itself. CRS otherwise classifies their URL/token
        # syntax as SSRF or SQLi depending on the generated random value.
        modsecurity_rules '
            SecRuleUpdateTargetById 934190 "!ARGS:redirect_uri"
            SecRuleUpdateTargetById 934190 "!ARGS:post_logout_redirect_uri"
            SecRuleUpdateTargetById 942420 "!REQUEST_COOKIES:KC_RESTART"
            SecRuleUpdateTargetById 942440 "!REQUEST_COOKIES:KC_RESTART"
        ';
        proxy_pass http://keycloak:8080;
    }

    location ~ ^/api/mails(?:/|$) {
        # Multipart mail requests intentionally contain binary attachment bytes
        # and a JSON document in the part named "data". CRS cannot recursively
        # parse that JSON part and otherwise scores its punctuation/UUIDs as SQLi.
        # Keep all rules active, but remove only the known false-positive
        # targets for this controller path.
        modsecurity_rules '
            SecRuleUpdateTargetById 920272 "!REQUEST_BODY"
            SecRuleUpdateTargetById 942200 "!ARGS:data"
            SecRuleUpdateTargetById 942340 "!ARGS:data"
            SecRuleUpdateTargetById 942370 "!ARGS:data"
            SecRuleUpdateTargetById 942430 "!ARGS:data"
            SecRuleUpdateTargetById 942431 "!ARGS:data"
            SecRuleUpdateTargetById 942460 "!ARGS:data"
        ';
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    location = /healthz {
        access_log off;
        modsecurity off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        proxy_pass http://frontend:8080;
    }
}
