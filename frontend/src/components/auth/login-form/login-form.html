<main class="flex items-center justify-center min-h-screen bg-gray-50 p-4">
  <section class="card w-full max-w-md p-8 shadow-lg text-center" aria-labelledby="login-heading">
    <h1 id="login-heading" class="text-2xl font-bold mb-3">THM Mail Support</h1>
    <p class="text-slate-600 mb-6">
      Sign in through the central Keycloak identity provider to access the support inbox.
    </p>
    <button pButton severity="contrast" type="button" class="w-full" (click)="login()">
      <span pButtonLabel>Sign in with Keycloak</span>
    </button>
  </section>
</main>
