spring.application.name=${APP_NAME:backend}

# Port-Konfiguration laut Vorlesungs-Best-Practice
server.port=${SERVER_PORT:8080}

# Datenbank-Konfiguration (Standardmäßig H2 für lokale Tests, überschreibbar für Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dbuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}

# Anwendungsspezifische Variablen mit sicheren Fallbacks
app.secret=${APP_SECRET:default_secret_key}
app.name=${APP_NAME:MyApp}
app.jwt.expires-seconds=${APP_JWT_EXPIRES:3600}
app.jwt.secret=${APP_JWT_SECRET:jwt_secret_key}

file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Mail transport / inbox sync
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:true}

mail.from-address=${MAIL_FROM_ADDRESS:${SPRING_MAIL_USERNAME:}}

mail.imap.host=${MAIL_IMAP_HOST:}
mail.imap.port=${MAIL_IMAP_PORT:993}
mail.imap.username=${MAIL_IMAP_USERNAME:}
mail.imap.password=${MAIL_IMAP_PASSWORD:}
mail.imap.folder=${MAIL_IMAP_FOLDER:INBOX}
mail.imap.poll-interval-ms=${MAIL_IMAP_POLL_INTERVAL_MS:300000}

