spring.application.name=${APP_NAME:backend}

# Port-Konfiguration laut Vorlesungs-Best-Practice
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# Datenbank-Konfiguration (Standardmaessig H2 fuer lokale Tests, ueberschreibbar fuer Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dbuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}

# OpenID Connect / Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost/auth/realms/mail-system}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost/auth/realms/mail-system/protocol/openid-connect/certs}
app.openapi.oidc-discovery-url=${OIDC_DISCOVERY_URL:http://localhost/auth/realms/mail-system/.well-known/openid-configuration}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:4200}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:8333}
storage.s3.bucket=${STORAGE_S3_BUCKET:mail-attachments}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:mail-system}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:mail-system-secret}

# Mail transport / inbox sync
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:true}

mail.from-address=${MAIL_FROM_ADDRESS:${SPRING_MAIL_USERNAME:}}
mail.reply-to-address=${MAIL_REPLY_TO_ADDRESS:}

mail.imap.host=${MAIL_IMAP_HOST:}
mail.imap.port=${MAIL_IMAP_PORT:993}
mail.imap.username=${MAIL_IMAP_USERNAME:}
mail.imap.password=${MAIL_IMAP_PASSWORD:}
mail.imap.folder=${MAIL_IMAP_FOLDER:INBOX}
mail.imap.poll-interval-ms=${MAIL_IMAP_POLL_INTERVAL_MS:5000}
mail.imap.recent-window-size=${MAIL_IMAP_RECENT_WINDOW_SIZE:50}
